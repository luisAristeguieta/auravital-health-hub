<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Degradado AuraVital: Rojo carmesí (#D00B2B) -> Violeta (#7C3AED) -> Azul médico (#2563EB) -->
    <linearGradient id="tabGrad" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D00B2B" />
      <stop offset="50%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#2563EB" />
    </linearGradient>

    <!-- Resplandor sutil para dar volumen -->
    <radialGradient id="innerGlow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.25" />
      <stop offset="60%" stopColor="#FFFFFF" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Contenedor cuadrado con esquinas redondeadas tipo app icon -->
  <rect width="64" height="64" rx="16" fill="url(#tabGrad)" />
  <rect width="64" height="64" rx="16" fill="url(#innerGlow)" />

  <!-- Silueta sutil de corazón médico integrada -->
  <path
    d="M 32 50 C 21 41.5 11 33 11 23 C 11 16 16.5 11.5 23 11.5 C 27 11.5 30.5 13.5 32 16.5 C 33.5 13.5 37 11.5 41 11.5 C 47.5 11.5 53 16 53 23 C 53 33 43 41.5 32 50 Z"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.4"
    fill="none"
  />

  <!-- Pulso vital ECG de alta visibilidad -->
  <path
    d="M 7 32 H 18.5 L 22.5 21.5 L 28 43 L 34.5 17 L 40 37.5 L 44 27.5 L 47 32 H 57"
    stroke="#FFFFFF"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Puntos luminosos en los picos del pulso -->
  <circle cx="34.5" cy="17" r="2.2" fill="#FFFFFF" />
  <circle cx="28" cy="43" r="2.2" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
